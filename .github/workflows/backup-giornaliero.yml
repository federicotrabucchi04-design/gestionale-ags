name: Backup giornaliero Firestore

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Installa dipendenze
        run: npm ci
      - name: Esporta Firestore in JSON
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: gestionale-ags
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Secret FIREBASE_SERVICE_ACCOUNT mancante."
            echo "Crea una chiave JSON del service account Firebase Admin e salvala come secret del repository."
            exit 1
          fi
          node tools/backup_firestore.mjs
      - name: Commit del backup
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: backup giornaliero Firestore"
          file_pattern: backups/*
